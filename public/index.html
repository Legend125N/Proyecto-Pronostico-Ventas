<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S&OP Engine - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .card { @apply bg-white p-6 rounded-xl shadow-sm border border-slate-200; }
        .btn-model { @apply px-4 py-2 rounded-lg border border-slate-300 text-sm font-medium transition-all hover:bg-blue-50; }
        .btn-model.active { @apply bg-blue-600 text-white border-blue-600 shadow-md; }
        .nav-btn { @apply flex items-center gap-2 px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-md transition-all; }
    </style>
</head>
<body class="min-h-screen text-slate-800">

    <!-- Header / Navbar -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 p-2 rounded-lg">
                    <i class="fas fa-chart-line text-white"></i>
                </div>
                <h1 class="text-xl font-bold tracking-tight text-slate-900 uppercase">S&OP Engine</h1>
            </div>
            <div class="flex gap-2">
                <button onclick="window.location.reload()" class="nav-btn border border-slate-200">
                    <i class="fas fa-sync-alt"></i> Reiniciar Proceso
                </button>
                <button class="bg-slate-900 text-white px-4 py-2 rounded-md text-sm font-medium flex items-center gap-2 hover:bg-slate-800 transition-all">
                    <i class="fas fa-file-pdf"></i> EXPORTAR PDF
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            
            <!-- Sidebar de Controles -->
            <aside class="lg:col-span-1 space-y-6">
                <div class="card">
                    <h2 class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-4">Segmentación</h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Producto</label>
                            <select class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                                <option>Todos los Productos</option>
                                <option>Línea A</option>
                                <option>Línea B</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">País / Región</label>
                            <select class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                                <option>Todas las Regiones</option>
                                <option>Norteamérica</option>
                                <option>Latam</option>
                                <option>Europa</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <h2 class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-4">Modelo Matemático</h2>
                    <div class="grid grid-cols-1 gap-2">
                        <button class="btn-model active">Regresión Lineal</button>
                        <button class="btn-model">Promedio Móvil</button>
                        <button class="btn-model">Suavización Exp.</button>
                    </div>
                </div>

                <div class="card">
                    <h2 class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-4">Horizonte</h2>
                    <div class="space-y-4">
                        <div class="flex justify-between items-center">
                            <span id="horizonteValue" class="text-2xl font-bold text-blue-600">12</span>
                            <span class="text-sm text-slate-400 font-medium uppercase">meses</span>
                        </div>
                        <input type="range" min="1" max="24" value="12" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600" 
                               oninput="document.getElementById('horizonteValue').innerText = this.value">
                    </div>
                </div>
            </aside>

            <!-- Main Content Area -->
            <div class="lg:col-span-3 space-y-6">
                
                <!-- Tab Navigation -->
                <div class="flex border-b border-slate-200 space-x-6">
                    <button class="pb-3 text-sm font-semibold border-b-2 border-blue-600 text-blue-600">Panel Visual</button>
                    <button class="pb-3 text-sm font-medium text-slate-400 hover:text-slate-600 transition-colors">Tabla de Datos</button>
                    <button class="pb-3 text-sm font-medium text-slate-400 hover:text-slate-600 transition-colors">Distribución</button>
                </div>

                <!-- KPI Grid -->
                <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                    <div class="card border-l-4 border-l-slate-400">
                        <p class="text-xs font-bold text-slate-400 uppercase tracking-tighter">Histórica Total</p>
                        <p class="text-2xl font-bold text-slate-800">$4,379,992</p>
                    </div>
                    <div class="card border-l-4 border-l-blue-500">
                        <p class="text-xs font-bold text-slate-400 uppercase tracking-tighter">Pronóstico Total</p>
                        <p class="text-2xl font-bold text-blue-600">$1,930,440</p>
                    </div>
                    <div class="card border-l-4 border-l-emerald-500">
                        <p class="text-xs font-bold text-slate-400 uppercase tracking-tighter">Promedio Hist.</p>
                        <p class="text-2xl font-bold text-slate-800">$141,290</p>
                    </div>
                    <div class="card border-l-4 border-l-indigo-500">
                        <p class="text-xs font-bold text-slate-400 uppercase tracking-tighter">Promedio Proy.</p>
                        <p class="text-2xl font-bold text-slate-800">$160,870</p>
                    </div>
                    <div class="card border-l-4 border-l-amber-500">
                        <p class="text-xs font-bold text-slate-400 uppercase tracking-tighter">Variabilidad (CV)</p>
                        <p class="text-2xl font-bold text-amber-600">24%</p>
                    </div>
                    <div class="card bg-slate-900 text-white flex items-center justify-center">
                        <div class="text-center">
                            <p class="text-[10px] opacity-60 uppercase font-bold">Estado</p>
                            <p class="text-sm font-semibold">Motor Activo</p>
                        </div>
                    </div>
                </div>

                <!-- Gráfico de Tendencia -->
                <div class="card">
                    <div class="flex items-center justify-between mb-6">
                        <h3 class="font-bold text-slate-800 flex items-center gap-2">
                            <i class="fas fa-chart-area text-blue-500"></i> Tendencia vs Pronóstico
                        </h3>
                        <div class="flex gap-4 text-xs">
                            <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-slate-300"></span> REAL</span>
                            <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-blue-500"></span> PRONÓSTICO</span>
                        </div>
                    </div>
                    <div class="h-80 w-full">
                        <canvas id="mainChart"></canvas>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script>
        // Inicialización del Gráfico
        window.onload = function() {
            const ctx = document.getElementById('mainChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'],
                    datasets: [
                        {
                            label: 'REAL',
                            data: [120, 150, 140, 160, 170, 155, 165, 150, 145, 160, 155, 141],
                            borderColor: '#cbd5e1',
                            backgroundColor: 'rgba(203, 213, 225, 0.1)',
                            borderWidth: 2,
                            fill: true,
                            tension: 0.4
                        },
                        {
                            label: 'PRONÓSTICO',
                            data: [null, null, null, null, null, null, null, null, null, null, null, 141, 150, 160, 165, 170],
                            borderColor: '#2563eb',
                            borderDash: [5, 5],
                            borderWidth: 3,
                            tension: 0.4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: false, grid: { color: '#f1f5f9' } },
                        x: { grid: { display: false } }
                    }
                }
            });
        };
    </script>
</body>
</html>
